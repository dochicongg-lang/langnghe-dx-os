# Cấu hình Eclipse Mosquitto 2 cho lớp thu nhận IoT biên (MQTT 3.1.1 / 5.0).
# Broker chỉ mở ra localhost (127.0.0.1:1883) để thiết bị/simulator thử nghiệm và mạng nội bộ Docker;
# tính xác thực dữ liệu đo ở biên được kiểm chứng bằng chữ ký số Ed25519 tại dịch vụ iot-mqtt-bridge và trace-api.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_type error
